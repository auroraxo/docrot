name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite (stdlib only)
        run: python3 -m unittest test_docrot test_version_drift -v

  docrot-check:
    # Dogfood auroraxo/docrot-check: scan this repository's own markdown for
    # dead image references. Warn-only for now — a red badge would be worse
    # than none until the gate has earned trust.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: auroraxo/docrot-check@c4addbc8d101eb45320ec168e9cc0ce383cd687a
        with:
          fail-on-broken: "false"
